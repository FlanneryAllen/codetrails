  <ellipse cx="150" cy="150" rx="100" ry="50" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6" transform="rotate(120 150 150)"></ellipse>
  <ellipse cx="150" cy="150" rx="100" ry="50" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6" transform="rotate(150 150 150)"></ellipse>

  
  <line x1="50" y1="150" x2="250" y2="150" stroke="currentColor" stroke-width="1.5" opacity="0.8"></line>

  
