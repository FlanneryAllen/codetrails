  <ellipse cx="150" cy="150" rx="100" ry="80" fill="none" stroke="currentColor" stroke-width="1" opacity="0.7"></ellipse>

  
  <ellipse cx="150" cy="150" rx="20" ry="100" fill="none" stroke="currentColor" stroke-width="1" opacity="0.7"></ellipse>
  <ellipse cx="150" cy="150" rx="40" ry="100" fill="none" stroke="currentColor" stroke-width="1" opacity="0.7"></ellipse>
