      <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.3"></stop>
      <stop offset="100%" style="stop-color:currentColor;stop-opacity:0"></stop>
    </radialGradient>
  </defs>

  
  <circle cx="150" cy="150" r="120" fill="url(#sphereGlow)" opacity="0.5"></circle>

  
  <circle cx="150" cy="150" r="100" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"></circle>

  
  <ellipse cx="150" cy="150" rx="100" ry="20" fill="none" stroke="currentColor" stroke-width="1" opacity="0.7"></ellipse>
  <ellipse cx="150" cy="150" rx="100" ry="40" fill="none" stroke="currentColor" stroke-width="1" opacity="0.7"></ellipse>
